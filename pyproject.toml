[project]
name = "retrorag"
version = "1.0.0"
description = "Build a RAG library of retro computer & console documentation for Claude and local AI"
requires-python = ">=3.10"
license = "AGPL-3.0-or-later"
readme = "README.md"
dependencies = [
    "PySide6>=6.7",
    "PyMuPDF>=1.24",
    "pytesseract>=0.3.10",
    "Pillow>=10.0",
    "numpy>=1.26",
    "httpx>=0.27",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "mcp>=2.0",
]

[project.optional-dependencies]
fastembed = ["fastembed>=0.3"]
build = ["pyinstaller>=6.0"]

[project.scripts]
retrorag = "retrorag.__main__:main"

[project.gui-scripts]
retrorag-gui = "retrorag.gui.app:run"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["retrorag*"]
